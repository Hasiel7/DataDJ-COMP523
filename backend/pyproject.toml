[project]
name = "data-dj-backend"
version = "0.1.0"
description = "FastAPI backend for Data DJ dimensionality reduction"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=2.2,<3.0",
    "pandas>=2.2,<4.0",
    "phate>=2.0,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "scikit-learn>=1.6,<2.0",
    "umap-learn>=0.5.7,<0.6",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]